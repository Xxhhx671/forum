<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — plush.cc</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">✦</span>
      <span class="logo-text">plush<span class="logo-accent">.cc</span></span>
    </a>
    <nav class="topnav">
      <a href="index.html" class="nav-link">Форум</a>
      <a href="#" class="nav-link">Маркет</a>
      <a href="#" class="nav-link">Статьи</a>
    </nav>
    <div class="topbar-right">
      <a href="login.html" class="btn btn-ghost">Войти</a>
      <a href="register.html" class="btn btn-primary">Регистрация</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html" class="logo" style="justify-content:center">
        <span class="logo-mark" style="font-size:24px">✦</span>
        <span class="logo-text" style="font-size:24px">plush<span class="logo-accent">.cc</span></span>
      </a>
    </div>

    <h2 class="auth-title">Вход в аккаунт</h2>
    <p class="auth-sub">Добро пожаловать обратно</p>

    <div class="form-group">
      <label class="form-label">Логин или Email</label>
      <input type="text" class="form-input" placeholder="username или email@mail.com">
    </div>

    <div class="form-group">
      <label class="form-label" style="display:flex;justify-content:space-between">
        <span>Пароль</span>
        <a href="#" style="font-size:11px;color:var(--accent2);text-transform:none;letter-spacing:0;font-weight:400">Забыли пароль?</a>
      </label>
      <input type="password" class="form-input" placeholder="••••••••">
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:20px">
      <input type="checkbox" id="remember" style="accent-color:var(--accent)">
      <label for="remember" style="font-size:13px;color:var(--text2);cursor:pointer">Запомнить меня</label>
    </div>

    <button class="btn btn-primary form-submit">Войти</button>

    <div class="auth-footer">
      Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
    </div>

    <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">
      <div style="font-size:11px;color:var(--text3);text-align:center;margin-bottom:12px">или войти через</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" style="flex:1;font-size:12px">🎮 Steam</button>
        <button class="btn btn-ghost" style="flex:1;font-size:12px">💬 Discord</button>
      </div>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
