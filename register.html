<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — plush.cc</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">✦</span>
      <span class="logo-text">plush<span class="logo-accent">.cc</span></span>
    </a>
    <nav class="topnav">
      <a href="index.html" class="nav-link">Форум</a>
      <a href="#" class="nav-link">Маркет</a>
      <a href="#" class="nav-link">Статьи</a>
    </nav>
    <div class="topbar-right">
      <a href="login.html" class="btn btn-ghost">Войти</a>
      <a href="register.html" class="btn btn-primary">Регистрация</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card" style="max-width:460px">
    <div class="auth-logo">
      <a href="index.html" class="logo" style="justify-content:center">
        <span class="logo-mark" style="font-size:24px">✦</span>
        <span class="logo-text" style="font-size:24px">plush<span class="logo-accent">.cc</span></span>
      </a>
    </div>

    <h2 class="auth-title">Создать аккаунт</h2>
    <p class="auth-sub">Присоединяйся к 24 000+ участникам</p>

    <div class="form-group">
      <label class="form-label">Имя пользователя</label>
      <input type="text" class="form-input" placeholder="coolnick123">
    </div>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" placeholder="email@domain.com">
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input type="password" class="form-input" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label class="form-label">Повтор пароля</label>
        <input type="password" class="form-input" placeholder="••••••••">
      </div>
    </div>

    <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:20px">
      <input type="checkbox" id="agree" style="accent-color:var(--accent);margin-top:2px">
      <label for="agree" style="font-size:12px;color:var(--text2);cursor:pointer;line-height:1.5">
        Я принимаю <a href="#">Правила форума</a> и <a href="#">Политику конфиденциальности</a>. Мне исполнилось 18 лет.
      </label>
    </div>

    <button class="btn btn-primary form-submit">Зарегистрироваться</button>

    <div class="auth-footer">
      Уже есть аккаунт? <a href="login.html">Войти</a>
    </div>

    <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">
      <div style="font-size:11px;color:var(--text3);text-align:center;margin-bottom:12px">или зарегистрироваться через</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" style="flex:1;font-size:12px">🎮 Steam</button>
        <button class="btn btn-ghost" style="flex:1;font-size:12px">💬 Discord</button>
      </div>
    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
